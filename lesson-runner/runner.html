<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Worldview lesson</title>
<style>html,body{margin:0;height:100%;background:#fbf8f2;font:15px system-ui,sans-serif;color:#6b6258}p{margin:0;padding:24px;text-align:center}</style>
</head>
<body>
<p id="s">Opening the lesson…</p>
<script>
/* Worldview lesson runner (NAV-187). A Worldview page shows lessons in a frame
   that loads this page from its own address. Browsers keep each address's
   sign-ins and storage apart, so a lesson here can use the microphone, camera and
   other browser features directly (with the browser's usual permission prompts)
   and still can never read a Worldview sign-in. This page only accepts a lesson
   from a Worldview page that frames it, then becomes that lesson. */
(function () {
  'use strict';
  var APP = /^(https:\/\/worldview\.cristianjperezb\.workers\.dev|http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?)$/;
  var SELF = /^(https:\/\/worldview-lessons\.cristianjperezb\.workers\.dev|http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?)$/;
  var s = document.getElementById('s');
  if (window.parent === window || !SELF.test(location.origin)) { s.textContent = 'Worldview lessons open inside Worldview.'; return; }
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.source !== window.parent || !m || m.port !== 'worldview-runner' || m.type !== 'load' || typeof m.html !== 'string') return;
    // never run a lesson on the same address as the Worldview page (that would put its sign-ins in reach)
    if (!APP.test(e.origin) || e.origin === location.origin) { window.parent.postMessage({port: 'worldview-runner', type: 'refused'}, '*'); return; }
    window.parent.postMessage({port: 'worldview-runner', type: 'accepted'}, e.origin);
    // Open the lesson as a fresh page on this address. Rewriting this page in place
    // (document.write) left lessons with a 0x0 window and animation frames that never
    // ran, so games stayed blank until a full reload. replace() adds no history entry.
    location.replace(URL.createObjectURL(new Blob([m.html], {type: 'text/html'})));
  });
  // Ask for the lesson once this frame has its real size (up to 3 s), so a lesson
  // that measures the screen when it starts never sees 0x0.
  var t0 = Date.now();
  (function ready() {
    if (innerWidth > 0 || Date.now() - t0 > 3000) window.parent.postMessage({port: 'worldview-runner', type: 'ready'}, '*');
    else setTimeout(ready, 50);
  })();
})();
</script>
</body>
</html>
