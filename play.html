<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worldview lesson</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="teacher.css?v=3.1.27">
<style>
  .wrap { max-width:560px; }
  .intro { display:grid; gap:12px; }
  .intro h1 { font-size:30px; }
  .linkbtn { all:unset; cursor:pointer; text-decoration:underline; color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="mark" href="./" aria-label="Worldview">W</a><b class="grow" id="title">Worldview</b><button type="button" class="btn ghost small" id="leave" hidden>✕ Leave lesson</button></div>

  <div class="card intro" id="intro">
    <p class="muted" id="loading">Opening the lesson…</p>
    <div id="ready" hidden>
      <h1 id="ltitle"></h1>
      <p class="muted small">A lesson made by a teacher on Worldview. Your answers are saved and shared with that teacher.</p>
      <p class="small" id="asname" hidden>Your teacher will see your answers as <b id="asnameb"></b>. <button type="button" class="linkbtn" id="changename">Change</button></p>
      <div id="namebox" style="display:grid;gap:6px"><label class="small" for="name">Your first name (optional, so your teacher knows it's you)</label>
      <input type="text" id="name" maxlength="60" autocomplete="given-name"></div>
      <div class="row"><button type="button" class="btn" id="resume" hidden>Continue where you left off</button><button type="button" class="btn" id="start">Start the lesson</button></div>
      <p class="muted small" id="resumenote" hidden></p>
    </div>
    <div id="missing" hidden style="display:grid;gap:12px"><p style="margin:0">This lesson isn't shared, or the link is wrong. Ask your teacher for a new link.</p><div class="row"><a class="btn" href="./">Go to Worldview</a></div></div>
  </div>

  <div id="lesson" hidden style="display:grid;gap:10px">
    <div class="phone"><iframe id="frame" sandbox="allow-scripts allow-forms" title="The lesson" referrerpolicy="no-referrer"></iframe></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="ph-panel" id="panel" aria-live="polite"></div>
    <p class="status" id="saved"></p>
    <div class="row" id="finished" hidden><b class="grow">You finished the lesson.</b><button type="button" class="btn" id="finishedback">Back to Worldview</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="port-host.js?v=3.1.55"></script>
<script>
(() => {
  const URL_ = 'https://eqppapoepynjvsfnoodj.supabase.co', KEY = 'sb_publishable_rfg0gznLhbAW07TlC4U6WQ_i8WqA3PT';
  const $ = s => document.querySelector(s);
  const id = new URLSearchParams(location.search).get('l') || '';
  const db = window.supabase.createClient(URL_, KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}});
  const newId = () => (crypto.randomUUID && crypto.randomUUID()) || ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  let runId = newId();
  /* NAV-182: a student's place in a lesson stays on their own device, per lesson and run.
     Same published version: they can continue the same run (answers kept); otherwise they start fresh. */
  const ls = {get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} }};
  const runKey = () => 'wv-run-' + id;
  const NAME_KEY = 'wv-learner-name';
  // the signed-in Worldview account on this device, if it has a name (read only; this page never signs in)
  const accountName = () => { try { const u = (JSON.parse(localStorage.getItem('worldview-alpha-auth')) || {}).user || {}, m = u.user_metadata || {}; return String(m.worldview_name || m.full_name || m.name || '').trim().split(/\s+/)[0].slice(0, 60); } catch (e) { return ''; } };
  // Worldview's AI and transcription for lessons (lesson-ai): plain requests, results always {ok, text, json, error, type, …}.
  const norm = async r => { const j = await r.json().catch(() => ({})); if (r.ok && j.ok !== false) return Object.assign({}, j, {ok: true}); const e = j.error; return Object.assign({}, j, {ok: false, error: (e && e.message) || (typeof e === 'string' && e) || 'The AI couldn\'t answer just now.', type: (e && e.type) || j.type || 'http_' + r.status}); };
  const authHeaders = async () => { let token = KEY; try { const s = (await db.auth.getSession()).data.session; if (s) token = s.access_token; } catch (e) {} return {apikey: KEY, authorization: 'Bearer ' + token}; };
  const askAI = async (req, lessonId, runId) => {
    try { return await norm(await fetch(URL_ + '/functions/v1/lesson-ai', {method: 'POST', headers: Object.assign({'content-type': 'application/json'}, await authHeaders()), body: JSON.stringify(Object.assign({lesson: lessonId, run: runId || null}, req))})); }
    catch (e) { return {ok: false, error: 'The AI couldn\'t answer just now. Check the internet connection.', type: 'network'}; }
  };
  const hearAI = async (blob, lang, lessonId, runId) => {
    try { return await norm(await fetch(URL_ + '/functions/v1/lesson-ai?mode=transcribe&lesson=' + lessonId + (runId ? '&run=' + runId : '') + (lang ? '&lang=' + lang : ''), {method: 'POST', headers: Object.assign({'content-type': blob.type || 'audio/webm'}, await authHeaders()), body: blob})); }
    catch (e) { return {ok: false, error: 'Worldview couldn\'t turn that recording into text. Check the internet connection.', type: 'network'}; }
  };
  let lesson = null, latest = [], finished = false, timer = 0, saving = false, again = false;
  async function save() {
    if (saving) { again = true; return; }
    saving = true; $('#saved').textContent = 'Saving your answers…';
    const {error} = await db.rpc('worldview_teacher_lesson_run_save', {p_run: runId, p_lesson: lesson.id, p_name: $('#name').value.trim(), p_answers: latest, p_finished: finished, p_version: lesson.version || null});
    $('#saved').textContent = error ? 'Your answers couldn\'t be saved just now. Keep going; they\'ll save with your next answer.' : (finished ? 'Saved. Your teacher can see your answers.' : 'Your answers are saved as you go.');
    saving = false; if (again) { again = false; save(); }
  }
  (async () => {
    if (!/^[0-9a-f-]{36}$/i.test(id)) { $('#loading').hidden = true; $('#missing').hidden = false; return; }
    const {data, error} = await db.rpc('worldview_teacher_lesson_get', {p_lesson: id});
    $('#loading').hidden = true;
    lesson = !error && Array.isArray(data) && data[0];
    if (!lesson) { $('#missing').hidden = false; return; }
    $('#ltitle').textContent = lesson.title; document.title = lesson.title + ' · Worldview'; $('#ready').hidden = false;
    const prev = ls.get(runKey());
    // A name given once (or the signed-in account's name) is used for every lesson on this device.
    const known = (prev && prev.name) || ls.get(NAME_KEY) || accountName();
    if (known) { $('#name').value = known; $('#asnameb').textContent = known; $('#asname').hidden = false; $('#namebox').hidden = true; }
    if (prev && prev.runId && (prev.version || null) === (lesson.version || null)) { $('#resume').hidden = false; $('#start').textContent = 'Start over'; $('#start').classList.add('ghost'); if (prev.name) $('#name').value = prev.name; $('#resumenote').hidden = false; $('#resumenote').textContent = 'You started this lesson on this device' + (prev.at ? ' on ' + new Date(prev.at).toLocaleDateString([], {month: 'short', day: 'numeric'}) : '') + '.'; }
  })();
  // Leaving: answers are already saved; go back where the student came from, or to Worldview.
  async function leave() {
    clearTimeout(timer); try { if (lesson) await save(); } catch (e) {}
    let sameSite = false; try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin && !/play(\.html)?$/.test(new URL(document.referrer).pathname); } catch (e) {}
    if (sameSite && history.length > 1) history.back(); else location.href = './';
  }
  $('#leave').addEventListener('click', leave);
  $('#finishedback').addEventListener('click', leave);
  function begin(resume) {
    const prev = ls.get(runKey());
    if (resume && prev && prev.runId) runId = prev.runId; else { if (prev && prev.runId) { ls.del('wv-state-' + prev.runId); ls.del('wv-record-' + prev.runId); } runId = newId(); }
    ls.set(runKey(), {runId, version: lesson.version || null, name: $('#name').value.trim(), at: Date.now()});
    if ($('#name').value.trim()) ls.set(NAME_KEY, $('#name').value.trim());
    $('#leave').hidden = false;
    $('#intro').hidden = true; $('#lesson').hidden = false; $('#title').textContent = lesson.title;
    const host = new WorldviewPortHost.PortHost({frame: $('#frame'), panel: $('#panel'), progress: $('#prog'), ai: req => askAI(req, lesson.id, runId), transcribe: (b, l) => hearAI(b, l, lesson.id, runId),
      state: {load: () => ls.get('wv-state-' + runId), save: v => ls.set('wv-state-' + runId, v)},
      initialRecord: resume ? (ls.get('wv-record-' + runId) || []) : [],
      onChange: (record, done) => { latest = record; finished = done; ls.set('wv-record-' + runId, record.slice(-200)); if (done) $('#finished').hidden = false; clearTimeout(timer); timer = setTimeout(save, done ? 0 : 800); }});
    // a published version plays its own locked-in files; older versions use the lesson's files
    host.run(lesson.html, lesson.id, lesson.version && lesson.files_frozen ? '_v/' + lesson.version + '/' : '');
    latest = host.record.slice(); save();
  }
  $('#changename').addEventListener('click', () => { $('#asname').hidden = true; $('#namebox').hidden = false; $('#name').focus(); $('#name').select(); });
  $('#start').addEventListener('click', () => begin(false));
  $('#resume').addEventListener('click', () => begin(true));
})();
</script>
</body>
</html>
