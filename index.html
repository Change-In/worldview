<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Worldview</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Worldview">
<meta name="theme-color" content="#f8f4ec">
<script>
try { document.documentElement.dataset.theme = (JSON.parse(localStorage.getItem("worldview-v1") || "{}").theme || "system"); }
catch (error) { document.documentElement.dataset.theme = "system"; }
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --ink: #2c241c;           /* warm charcoal */
    /* An inverted surface (toasts, the active recording pill) must flip WITH the
       theme. These were hardcoded to var(--ink) + #fff, which in dark mode is
       cream-on-white and unreadable â€” reported live. */
    --notice-bg:#2c241c; --notice-ink:#fdf8f0;
    --ink-soft: #6f6355;
    --paper: #f8f4ec;         /* cream */
    --card: #fdfaf5;
    --line: #e4dccb;          /* soft divider, not a hard border */
    --accent: #bd5a30;        /* terracotta */
    --accent-100: #f3ded0;
    --accent-700: #8a3f22;
    --radius: 28px;           /* cards / dialogs */
    --radius-sm: 12px;        /* inputs / small controls */
    --radius-md: 18px;        /* sheets / panels */
    --shadow-sm: 0 2px 8px rgba(44,36,28,.08);
    --shadow-md: 0 8px 24px rgba(44,36,28,.10);
    --shadow-lg: 0 18px 50px rgba(44,36,28,.16);
    --surface-soft: rgba(44,36,28,.05);
    --overlay: rgba(44,36,28,.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --ink:#f4ece0;
    --ink-soft:#b6a894;
    --paper:#241f1a;
    --notice-bg:#f4ece0; --notice-ink:#201914;
    --card:#332c25;
    --line:rgba(244,236,224,.14);
    --accent:#e2895a;
    --accent-100:rgba(226,137,90,.18);
    --accent-700:#eec7ab;
    --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
    --shadow-md: 0 10px 30px rgba(0,0,0,.42);
    --shadow-lg: 0 20px 55px rgba(0,0,0,.5);
    --surface-soft:rgba(255,255,255,.035);
    --overlay:rgba(0,0,0,.68);
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark) {
    :root[data-theme="system"] {
      --ink:#f4ece0;
      --ink-soft:#b6a894;
      --paper:#241f1a;
      --notice-bg:#f4ece0; --notice-ink:#201914;
      --card:#332c25;
      --line:rgba(244,236,224,.14);
      --accent:#e2895a;
      --accent-100:rgba(226,137,90,.18);
      --accent-700:#eec7ab;
      --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
      --shadow-md: 0 10px 30px rgba(0,0,0,.42);
      --shadow-lg: 0 20px 55px rgba(0,0,0,.5);
      --surface-soft:rgba(255,255,255,.035);
      --overlay:rgba(0,0,0,.68);
      color-scheme:dark;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* manipulation kills the browser's double-tap-zoom gesture, which was
     swallowing single taps on lesson cards (phone tapped, nothing opened) */
  html, body { height: 100%; overscroll-behavior: none; touch-action: manipulation; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }

  /* shown only when the app is opened as a raw file (voice mic keeps prompting) */
  #file-warning {
    display: none; flex: 0 0 auto;
    background: #7a2e2e; color: #fff; font-size: 12.5px; line-height: 1.45;
    padding: calc(env(safe-area-inset-top) + 9px) 34px 9px 14px; text-align: center; position: relative;
  }
  #file-warning b { text-decoration: underline; }
  #fw-x { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 8px); cursor: pointer; opacity: 0.85; }

  /* An installed PWA keeps the origin it was installed from. Never move it
     silently: browser storage and the authenticated session do not follow. */
  #origin-warning {
    position:fixed;z-index:240;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--card);
    color:var(--ink);box-shadow:var(--shadow-lg);font-size:12px;line-height:1.45;
  }
  #origin-warning[hidden] { display:none; }
  #origin-warning strong { display:block;font-size:13px;margin-bottom:2px; }
  .origin-warning-actions { display:flex;align-items:center;gap:7px; }
  .origin-warning-actions a,.origin-warning-actions button {
    min-height:38px;padding:8px 11px;border-radius:999px;font:700 11px/1 system-ui,sans-serif;white-space:nowrap;
  }
  .origin-warning-actions a { display:inline-flex;align-items:center;background:var(--accent);color:#fff;text-decoration:none; }
  .origin-warning-actions button { border:1px solid var(--line);background:transparent;color:var(--ink-soft); }
  @media(max-width:560px){#origin-warning{grid-template-columns:1fr}.origin-warning-actions{justify-content:flex-start;flex-wrap:wrap}}

  /* Account recovery is deliberately visible and persistent. An offline cache
     can be read, but no lesson/Note edit is allowed until the server identity
     is verified; an unowned pre-v69 library needs an explicit Import or Start
     fresh choice before it can ever become an account-owned cloud row. */
  #account-guard {
    position:fixed;z-index:230;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--card);
    color:var(--ink);box-shadow:var(--shadow-lg);
  }
  #account-guard[hidden] { display:none; }
  #account-guard strong { display:block;font-size:13px;line-height:1.35; }
  #account-guard-copy { display:block;margin-top:3px;color:var(--ink-soft);font-size:11.5px;line-height:1.42; }
  .account-guard-actions { display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap; }
  .account-guard-actions button { min-height:38px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:11.5px;font-weight:700;cursor:pointer; }
  #account-guard-import { border-color:var(--accent);background:var(--accent);color:#fff; }
  @media(max-width:560px){#account-guard{grid-template-columns:1fr;top:max(7px,env(safe-area-inset-top))}.account-guard-actions{justify-content:stretch}.account-guard-actions button{flex:1}}

  #update-banner {
    display: none; flex: 0 0 auto; align-items: center; gap: 10px;
    background: var(--ink); color: #fff; font-size: 13px;
    padding: calc(env(safe-area-inset-top) + 9px) 14px 9px; position: relative;
  }
  #update-banner.show { display: flex; }
  #update-banner span { flex: 1; }
  #update-refresh {
    background: #fff; color: var(--ink); border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  #update-x { cursor: pointer; opacity: 0.7; padding: 4px; }

  /* first launch of a new version: a full-screen green flash, visible from
     across the room, that dissolves to reveal what's new */
  #splash {
    position: fixed; inset: 0; z-index: 200; background: #2f8f5b;
    display: none; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
  }
  #splash.show { display: flex; }
  #splash.fading { opacity: 0; }
  #splash-mark { width: 64px; height: 64px; }
  #splash-mark path { stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* First run: a compact launch surface, not a tutorial. */
  #intro-demo {
    position: fixed; inset: 0; z-index: 210; display: none; place-items: center;
    padding: max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    background: color-mix(in srgb,var(--paper) 97%,transparent); backdrop-filter: blur(10px); overflow-y:auto;
  }
  #intro-demo.open { display: grid; }
  .intro-card {
    position: relative; width: min(480px,100%); padding: clamp(20px,5vw,36px) clamp(17px,5vw,34px) 18px;
    border: 1.5px solid var(--line); border-radius: 22px; background: var(--card);
    box-shadow: 0 22px 70px rgba(44,36,28,.13); text-align: center;
    animation: introCardIn .42s cubic-bezier(.22,.8,.25,1) both;
  }
  .intro-wordmark { color: var(--ink-soft); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
  .intro-card h2 { margin: 9px auto 6px; max-width: 410px; font: 600 clamp(31px,8vw,44px)/1.04 Georgia,serif; }
  .intro-card > p { margin: 0 auto; max-width: 410px; color: var(--ink-soft); font-size: clamp(14px,3.8vw,16px); line-height: 1.4; }
  .intro-account-setup { margin:17px 0 12px; }
  .intro-account-row,.intro-code-row { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px; }
  .intro-code-row.link-fallback { grid-template-columns:1fr; }
  .intro-code-row.link-fallback input { display:none; }
  .intro-account-row[hidden],.intro-code-row[hidden],#intro-account-connected[hidden] { display:none; }
  #intro-account-email,#intro-account-code { min-width:0;height:45px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:0 13px;font-size:15px;outline:none; }
  #intro-account-code { letter-spacing:.18em;font-variant-numeric:tabular-nums; }
  #intro-account-email:focus,#intro-account-code:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,77,91,.1); }
  #intro-account,#intro-account-verify { min-height:45px;padding:0 14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer; }
  #intro-account:disabled,#intro-account-verify:disabled { opacity:.55;cursor:wait; }
  #intro-account-connected { min-height:45px;display:flex;align-items:center;justify-content:center;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:650; }
  #intro-account-status { min-height:0;margin:7px 2px 0!important;color:var(--ink-soft);font-size:11px!important;line-height:1.35!important; }
  #intro-account-status:empty { display:none; }
  .intro-question { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:0; }
  #intro-topic { min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:0 13px;font-size:15px;outline:none; }
  #intro-topic:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,77,91,.1); }
  #intro-start { min-width:76px; min-height:48px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  #intro-start:disabled { opacity:.38;cursor:default; }
  #intro-install { width:100%;min-height:42px;margin:9px auto 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:650;cursor:pointer; }
  #intro-install[hidden] { display:none; }
  #intro-skip { width:100%;min-height:45px;margin-top:9px;padding:8px 14px;border:1.5px solid var(--accent);border-radius:12px;background:transparent;color:var(--accent-700);font-size:13px;font-weight:750;cursor:pointer; }
  @keyframes introCardIn { from { opacity:0; transform:translateY(18px) scale(.985) } }
  @keyframes introLine { from { transform:scaleX(0); opacity:.25 } }
  @keyframes introNode { from { transform:scale(.45); opacity:0 } }
  @media (max-width:350px) { .intro-account-row,.intro-code-row{grid-template-columns:1fr}.intro-question{grid-template-columns:1fr auto} }
  @media (max-height:610px) { #intro-demo{place-items:start center}.intro-card{padding-top:16px}.intro-card h2{font-size:28px}.intro-account-setup{margin-top:12px} }
  @media (prefers-reduced-motion:reduce) { .intro-card{animation:none!important} }

  /* Ask for microphone access before the first lesson so permission and a
     learner's first recorded words are never the same gesture. */
  #mic-primer {
    position:fixed;inset:0;z-index:212;display:none;place-items:center;
    padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));
    overflow-y:auto;background:color-mix(in srgb,var(--paper) 97%,transparent);backdrop-filter:blur(12px);
  }
  #mic-primer.open { display:grid; }
  .mic-primer-card {
    width:min(430px,100%);padding:clamp(28px,7vw,44px);border:1.5px solid var(--line);
    border-radius:24px;background:var(--card);box-shadow:0 22px 70px rgba(44,36,28,.15);
    text-align:center;animation:introCardIn .36s cubic-bezier(.22,.8,.25,1) both;
  }
  .mic-primer-icon { width:68px;height:68px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:var(--notice-bg);color:var(--notice-ink); }
  .mic-primer-icon svg { width:30px;height:30px; }
  .mic-primer-card h2 { margin:0 0 10px;font:600 clamp(28px,7vw,38px)/1.05 Georgia,serif; }
  .mic-primer-card > p { margin:0 auto;color:var(--ink-soft);font-size:15px;line-height:1.55;max-width:340px; }
  .mic-primer-actions { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px; }
  .mic-primer-actions button { min-height:50px;border-radius:14px;font-size:14px;font-weight:650;cursor:pointer; }
  #mic-primer-enable { border:0;background:var(--accent);color:#fff; }
  #mic-primer-later { border:1.5px solid var(--line);background:var(--paper);color:var(--ink); }
  #mic-primer-enable:disabled { opacity:.55;cursor:wait; }
  #mic-primer-status { min-height:20px;margin-top:13px;color:var(--ink-soft);font-size:12px;line-height:1.45; }
  #mic-primer-status.is-error { color:var(--accent-700); }
  @media (max-width:420px) { .mic-primer-actions{grid-template-columns:1fr} }
  @media (max-height:520px) { #mic-primer{place-items:start center}.mic-primer-card{padding:22px}.mic-primer-icon{width:52px;height:52px;margin-bottom:12px}.mic-primer-actions{margin-top:17px} }

  /* Lesson intake is a short, full-screen topic conversation before planning.
     Knowledge extraction belongs in the lesson shell, not this launch gate. */
  #lesson-intake {
    position:fixed;inset:0;z-index:211;display:none;place-items:center;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
